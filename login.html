<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Owner Login | Nexa Line Ltd</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;font-family:Inter,sans-serif;background:linear-gradient(160deg,#0b1f3a,#13305a);color:#14213a}
.box{background:#fff;width:100%;max-width:400px;border-radius:16px;padding:36px;border-top:4px solid #f58220;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{font-family:Montserrat,sans-serif;text-align:center;margin-bottom:6px}
.logo .n{font-weight:800;font-size:1.8rem;color:#0b1f3a}.logo .n b{color:#f58220}
.logo .l{font-weight:700;color:#5fb4e6;letter-spacing:.22em;margin-left:6px}
h1{font:700 1.1rem Montserrat,sans-serif;text-align:center;color:#0b1f3a;margin-bottom:24px}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:12px 14px;border:1px solid #cfd8e3;border-radius:8px;font:inherit}
button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:8px;background:#f58220;color:#fff;font:600 1rem Inter,sans-serif;cursor:not-allowed;opacity:.6}
.note{margin-top:18px;font-size:.85rem;color:#5b6678;text-align:center}
a{color:#0b1f3a}
</style>
</head>
<body>
<div class="box">
  <div class="logo"><span class="n">NE<b>X</b>A</span><span class="l">LINE</span></div>
  <h1>Owner Portal</h1>
  <label for="e">Email</label><input id="e" type="email" disabled>
  <label for="p">Password</label><input id="p" type="password" disabled>
  <button disabled>Sign in</button>
  <p class="note">Secure sign-in is being set up.<br><a href="/">&larr; Back to nexaline.ca</a></p>
</div>
</body>
</html>
